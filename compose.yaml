services:
  db:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: ${DB_NAME:-kkd}
      POSTGRES_USER: ${DB_USER:-kkd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kkd_local}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/${DB_NAME:-kkd}
      DB_USER: ${DB_USER:-kkd}
      DB_PASSWORD: ${DB_PASSWORD:-kkd_local}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      TZ: ${TZ:-UTC}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  postgres_data:
