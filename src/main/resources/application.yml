spring:
  application:
    name: kkd-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/kkd}
    username: ${DB_USER:kkd}
    password: ${DB_PASSWORD:kkd_local}
    hikari:
      maximum-pool-size: 8
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
server:
  port: ${APP_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
kkd:
  demo-enabled: ${DEMO_ENABLED:true}
